server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 해시가 붙은 정적 파일은 장기 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: 딥링크(/market/kr/005930 등) 새로고침 시 index.html 로 라우팅
    location / {
        try_files $uri $uri/ /index.html;
    }
}

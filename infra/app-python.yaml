# backend-python 은 하나의 이미지를 3가지 역할로 실행한다.
#   backend-python         : 시세 조회 내부 API (uvicorn, 수평 확장 가능)
#   backend-python-worker  : Kafka 분석 요청 consumer
#   backend-python-stream  : Upbit 실시간 시세 수집 (반드시 1 replica)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-python
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-python
  template:
    metadata:
      labels:
        app: backend-python
    spec:
      containers:
        - name: backend-python
          image: your-registry/tbill-backend-python:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            # Redis
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_PASSWORD
            # Java → Python 내부 API 토큰
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: PYTHON_INTERNAL_TOKEN
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-python-svc
spec:
  selector:
    app: backend-python
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-python-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-python-worker
  template:
    metadata:
      labels:
        app: backend-python-worker
    spec:
      containers:
        - name: backend-python-worker
          image: your-registry/tbill-backend-python:latest
          imagePullPolicy: Always
          command: ["python", "-m", "app.worker.main"]
          env:
            # Kafka
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_CONSUMER_GROUP_ID
              value: "tbill-python-group"
            # Redis
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-python-stream
spec:
  replicas: 1  # 반드시 1 (중복 실행 시 tick 이중 발행)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend-python-stream
  template:
    metadata:
      labels:
        app: backend-python-stream
    spec:
      containers:
        - name: backend-python-stream
          image: your-registry/tbill-backend-python:latest
          imagePullPolicy: Always
          command: ["python", "-m", "app.stream.main"]
          env:
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

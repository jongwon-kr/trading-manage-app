version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: tbill-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tbill-network

  redis:
    image: redis:7-alpine
    container_name: tbill-redis
    command: redis-server --requirepass 1234
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tbill-network


  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: tbill-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - tbill-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: tbill-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # 호스트(Java bootRun 등)는 localhost:9092, compose 내부 컨테이너는 kafka:29092 로 접속
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - tbill-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: tbill-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8989:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - tbill-network

  # --- 애플리케이션 서비스 (선택): docker compose --profile app up -d ---
  # 로컬 개발 시에는 backend-python 에서 직접 실행해도 된다 (README 참고).
  py-api:
    build: ./backend-python
    container_name: tbill-py-api
    profiles: ["app"]
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: &py-env
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: 1234
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INTERNAL_TOKEN: local-dev-token
    ports:
      - "8000:8000"
    depends_on:
      - redis
    networks:
      - tbill-network

  py-worker:
    build: ./backend-python
    container_name: tbill-py-worker
    profiles: ["app"]
    command: ["python", "-m", "app.worker.main"]
    environment: *py-env
    depends_on:
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - tbill-network

  # Upbit 실시간 시세 → Redis pub/sub. 반드시 1개만 실행 (중복 시 tick 이중 발행)
  py-stream:
    build: ./backend-python
    container_name: tbill-py-stream
    profiles: ["app"]
    command: ["python", "-m", "app.stream.main"]
    environment: *py-env
    depends_on:
      - redis
    networks:
      - tbill-network

volumes:
  postgres_data:
  zookeeper_data:
  kafka_data:
  redis_data:

networks:
  tbill-network:
    driver: bridge
